[workspace]
members = [
    "steel-host",
    "steel-plugin-macros",
    "steel-plugin-sdk",
    "examples/consumer-plugin",
    "examples/provider-plugin",
    "examples/listening-plugin",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
authors = ["Alvsch"]

[profile.release]
lto = true
codegen-units = 1
panic = "abort"

[profile.profiling]
inherits = "release"
debug = true

[workspace.dependencies]
steel-plugin-sdk = { path = "steel-plugin-sdk" }
steel-plugin-macros = { path = "steel-plugin-macros" }
steel-plugin-core = { path = "steel-plugin-core" }

steel-core = { git = "https://github.com/Alvsch/SteelMC", branch = "plugin-api" }
steel-utils = { git = "https://github.com/Alvsch/SteelMC", branch = "plugin-api" }

tokio = { version = "1.54.1", features = ["macros", "rt", "rt-multi-thread", "fs"] }

wasmtime = { version = "50.0.0", default-features = false }
wasmtime-wasi = { version = "50.0.0", default-features = false }
wasmparser = { version ="0.262.0", default-features = false, features = ["component-model"] }
wit-bindgen = "0.63.0"

serde = { version = "1.0.229", features = ["derive"] }
rmp-serde = "1.3.1"
semver = { version = "1.0.28", features = ["serde"] }

# errors
thiserror = "2.0"
anyhow = "1.0"

# proc macro
syn = "3.0.9"
quote = "1.0.47"
proc-macro2 = "1.0.107"
proc-macro-crate = "3.5.0"
inventory = "0.3.25"

# Logging
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

# Testing
tempfile = "3.27.0"

[workspace.lints.rust]
# TODO: change to warn
missing_docs = "allow"

[workspace.lints.clippy]
single_call_fn = "allow"
multiple_inherent_impl = "allow"
shadow_unrelated = "allow"
missing_errors_doc = "allow"
struct_excessive_bools = "allow"
needless_pass_by_value = "allow"
cargo_common_metadata = "allow"
cast_sign_loss = "allow"
cast_possible_wrap = "allow"
cast_possible_truncation = "allow"
cast_precision_loss = "allow"
absolute_paths = "allow"
missing_const_for_fn = "warn"
# TOOD: remove
missing_panics_doc = "allow"

all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -2 }
unwrap_used = { level = "warn", priority = -3 }
